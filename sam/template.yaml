AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Floating Brain development environment.

Parameters:
  CallbackURL:
    Type: String
    Default: floatingbrain://oauth/callback
  CognitoDomainPrefix:
    Type: String
    Description: Globally unique Cognito hosted UI domain prefix.
  SelectionTimeZone:
    Type: String
    Default: America/Los_Angeles
    Description: IANA timezone used to define the daily selection boundary.
  DailySelectionUserId:
    Type: String
    Default: ''
    Description: Cognito user sub whose daily selection is materialized by the scheduler.

Globals:
  Function:
    Runtime: python3.12
    Timeout: 15
    MemorySize: 256
    Environment:
      Variables:
        TABLE_NAME: !Ref FloatingBrainTable
        SELECTION_TIME_ZONE: !Ref SelectionTimeZone
        DAILY_SELECTION_USER_ID: !Ref DailySelectionUserId

Resources:
  FloatingBrainUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub floating-brain-${AWS::StackName}
      AutoVerifiedAttributes:
        - email
      UsernameAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          RequireUppercase: true

  FloatingBrainUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref FloatingBrainUserPool
      ClientName: floating-brain-ios
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - openid
        - email
      SupportedIdentityProviders:
        - COGNITO
      CallbackURLs:
        - !Ref CallbackURL
      LogoutURLs:
        - !Ref CallbackURL

  FloatingBrainUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Ref CognitoDomainPrefix
      UserPoolId: !Ref FloatingBrainUserPool

  FloatingBrainTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub FloatingBrain-${AWS::StackName}
      BillingMode: PROVISIONED
      ProvisionedThroughput:
        ReadCapacityUnits: 5
        WriteCapacityUnits: 5
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      SSESpecification:
        SSEEnabled: true

  FloatingBrainHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: v1
      Auth:
        Authorizers:
          CognitoAuthorizer:
            JwtConfiguration:
              issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${FloatingBrainUserPool}
              audience:
                - !Ref FloatingBrainUserPoolClient
            IdentitySource: "$request.header.Authorization"

  SyncFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambda/
      Handler: app.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:Query
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:BatchWriteItem
                - dynamodb:TransactWriteItems
              Resource: !GetAtt FloatingBrainTable.Arn
      Events:
        Sync:
          Type: HttpApi
          Properties:
            ApiId: !Ref FloatingBrainHttpApi
            Path: /reminders/sync
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer
        Active:
          Type: HttpApi
          Properties:
            ApiId: !Ref FloatingBrainHttpApi
            Path: /reminders/active
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer
        Daily:
          Type: HttpApi
          Properties:
            ApiId: !Ref FloatingBrainHttpApi
            Path: /reminders/daily
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer
        Capture:
          Type: HttpApi
          Properties:
            ApiId: !Ref FloatingBrainHttpApi
            Path: /items/capture
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer

  DailySelectionScheduleRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeDailySelectionLambda
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt SyncFunction.Arn

  DailySelectionSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      FlexibleTimeWindow:
        Mode: OFF
      ScheduleExpression: cron(0 6 * * ? *)
      ScheduleExpressionTimezone: !Ref SelectionTimeZone
      Target:
        Arn: !GetAtt SyncFunction.Arn
        RoleArn: !GetAtt DailySelectionScheduleRole.Arn
        Input: '{"source":"aws.scheduler","detail-type":"DailySelection"}'

  DailySelectionSchedulePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref SyncFunction
      Principal: scheduler.amazonaws.com
      SourceArn: !GetAtt DailySelectionSchedule.Arn

Outputs:
  UserPoolId:
    Value: !Ref FloatingBrainUserPool
  UserPoolClientId:
    Value: !Ref FloatingBrainUserPoolClient
  CognitoIssuer:
    Value: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${FloatingBrainUserPool}
  CognitoAuthorizationEndpoint:
    Value: !Sub https://${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com/oauth2/authorize
  CognitoTokenEndpoint:
    Value: !Sub https://${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com/oauth2/token
  SyncApiBaseURL:
    Value: !Sub https://${FloatingBrainHttpApi}.execute-api.${AWS::Region}.amazonaws.com
