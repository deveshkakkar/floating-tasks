name: Photon agent offline checks

on:
  push:
    branches:
      - 'photon-typing-*'

permissions:
  contents: read

jobs:
  photon-agent-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: floating
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: floating/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test source without network or runner credentials
        run: |
          docker run --rm --pull always --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges \
            --pids-limit 64 --memory 512m --cpus 1 \
            --tmpfs /tmp:rw,nosuid,nodev,size=64m \
            --user 1000:1000 \
            --mount "type=bind,src=$PWD,dst=/app,readonly" \
            --workdir /app \
            --entrypoint sh \
            node:22-bookworm-slim@sha256:48e4b67d85f87bd551df43704e24d252f56cc5f8e9718841aace50f19948f0f9 \
            -c 'npm test && npm run typecheck'
